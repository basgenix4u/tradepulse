version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (generate one, do not reuse)}
      POSTGRES_DB: ${POSTGRES_DB:-tradepulse}
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tradepulse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-tradepulse}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (generate one, do not reuse)}
      PORT: 8080
    depends_on:
      - postgres
